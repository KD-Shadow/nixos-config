[config]

[templates.niri]
input_path = './templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'
post_hook = 'niri msg action load-config-file'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.ghostty]
input_path = './templates/ghostty-colors'
output_path = '~/.config/ghostty/themes/Matugen'
post_hook = 'pkill -SIGUSR2 ghostty'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.alacritty]
input_path = './templates/alacritty-colors.toml'
output_path = '~/.config/alacritty/colors.toml'

[templates.neovim]
input_path = './templates/neovim-colors.lua'
output_path = '~/.config/nvim/lua/matugen.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.limusic]
input_path = './templates/limusic-colors.css'
output_path = '~/.config/limusic/matugen.css'

[templates.strata]
input_path = './templates/strata-theme.toml'
output_path = '~/.config/strata/themes/matugen.toml'
