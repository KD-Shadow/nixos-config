# ── Core ────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g mouse on
set -g mode-keys vi
setw -g aggressive-resize on
set -gq allow-passthrough on

# ── Numbering ───────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── Basics ──────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits / windows keep the current path
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Navigation ──────────────────────────────────────────────────────────────
# Ctrl-h/j/k/l is handled by vim-tmux-navigator (works across nvim splits).
# Prefix + hjkl also works as a fallback:
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-1..9 jumps to window, Shift-Left/Right cycles
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reorder windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ── Resize (repeatable) ─────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# ── Copy mode (vi) ──────────────────────────────────────────────────────────
bind v copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel

# ── Sessions ────────────────────────────────────────────────────────────────
bind f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind n command-prompt -p "New session:" "new-session -s '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
bind s choose-tree -Zs
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# ── Popups ──────────────────────────────────────────────────────────────────
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"
bind C-b display-popup -w 85% -h 85% -E "btop"

# ── Fallback colors (Noctalia overrides these if it defines them) ───────────
set -g @thm_bg        "#1e1e2e"
set -g @thm_fg        "#cdd6f4"
set -g @thm_accent    "#89b4fa"
set -g @thm_dim       "#6c7086"
set -g @thm_alert     "#fab387"

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-justify left

set -g status-left-length 40
set -g status-left "#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary}] #S #[default]#{?client_prefix,#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary_container}] PREFIX #[default],} "

set -g status-right-length 60
set -g status-right "#[fg=#{@noctalia_on_surface_variant}]#{?window_zoomed_flag,ZOOM  ,}%a %d %b  #[fg=#{@noctalia_on_surface},bold]%H:%M "

set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g window-status-separator ""
set -g window-status-format         "#[fg=#{@noctalia_on_surface_variant}] #I:#W "
set -g window-status-current-format "#[bg=#{@noctalia_surface_container_highest},fg=#{@noctalia_on_surface},bold] #I:#W "
set -g monitor-activity on
set -g visual-activity off

# Panes & messages
set -g pane-border-lines single
set -g pane-border-style        "fg=#{@thm_dim}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g message-style            "bg=#{@thm_accent},fg=#{@thm_bg},bold"
set -g message-command-style    "bg=#{@thm_alert},fg=#{@thm_bg},bold"
set -g mode-style               "bg=#{@thm_accent},fg=#{@thm_bg}"

# ── Plugins ─────────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/.tmux/plugins/tpm/tpm'

# ── Noctalia theme (keep last so it overrides the fallbacks above) ──────────


source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
